name: QuickSTRM Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Synchronize Version Metadata & Extract Notes
        id: sync
        run: |
          python .github/scripts/sync_release.py --extract-notes

      - name: Publish QuickSTRM
        run: dotnet publish -c Release -o ./publish/QuickSTRM

      # Packages artifacts with strict validation against bundled runtime libraries
      - name: Verify and Package Release Artifacts
        run: |
          if ls ./publish/QuickSTRM/Jellyfin.*.dll 1> /dev/null 2>&1 || ls ./publish/QuickSTRM/MediaBrowser.*.dll 1> /dev/null 2>&1; then
            echo "ERROR: Jellyfin runtime assemblies detected in publish output. ExcludeAssets=runtime is violated!"
            exit 1
          fi

          cp meta.json ./publish/QuickSTRM/
          cp build.yaml ./publish/QuickSTRM/

          # Recursively zip all contents including hidden files without flattening intended structures
          cd ./publish/QuickSTRM
          zip -r ../../QuickSTRM.zip .
          cd ../../

          cp ./publish/QuickSTRM/QuickSTRM.dll ./QuickSTRM.dll

      - name: Update Manifest Checksum and Timestamp
        run: |
          python .github/scripts/sync_release.py --update-checksum QuickSTRM.zip

      - name: Commit and Push Synchronized Release Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json meta.json build.yaml QuickSTRM.csproj README.md
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): synchronize version metadata and manifest [skip ci]"
            # Pull latest changes from origin/main to prevent race-condition non-fast-forward rejection
            git pull --rebase origin main || true
            # Explicitly push to the branch ref to bypass ambiguous tag/branch naming
            git push origin HEAD:refs/heads/main
          fi

      - name: Deploy Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            QuickSTRM.zip
            QuickSTRM.dll
