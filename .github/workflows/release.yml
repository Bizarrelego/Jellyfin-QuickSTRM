name: QuickSTRM Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish QuickSTRM
        run: dotnet publish -c Release -o ./publish

      - name: Package Plugin
        run: |
          cd ./publish
          zip -r ../QuickSTRM.zip .
          cd ..

      - name: Update Manifest Checksum and Timestamp
        run: |
          # Calculate MD5 and convert to uppercase
          CHECKSUM=$(md5sum QuickSTRM.zip | awk '{ print $1 }' | tr 'a-z' 'A-Z')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Safely update the checksum and timestamp of the latest version (index 0)
          # Handles both standard Jellyfin array-based manifests and single-object manifests
          jq --arg checksum "$CHECKSUM" --arg timestamp "$TIMESTAMP" \
            'if type=="array" then 
               .[0].versions[0].checksum = $checksum | .[0].versions[0].timestamp = $timestamp 
             else 
               .versions[0].checksum = $checksum | .versions[0].timestamp = $timestamp 
             end' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json

      - name: Commit and Push Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update manifest.json checksum [skip ci]"
            # Explicitly push to the branch ref to bypass ambiguous tag/branch naming
            git push origin HEAD:refs/heads/main
          fi

      - name: Deploy Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          files: QuickSTRM.zip
