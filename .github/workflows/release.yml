name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compile and Publish
        run: |
          dotnet publish -c Release -o ./publish
          # Include manifests inside publish bundle if present
          cp meta.json ./publish/ 2>/dev/null || true
          cp build.yaml ./publish/ 2>/dev/null || true

      - name: Package Release
        run: |
          # Zip contents of ./publish directly into QuickSTRM.zip (not the directory itself)
          cd ./publish
          zip -r ../QuickSTRM.zip .
          cd ..

      - name: Calculate Checksum and Update Manifest
        run: |
          # Calculate MD5 checksum formatted as uppercase string
          MD5_CHECKSUM=$(md5sum QuickSTRM.zip | awk '{print toupper($1)}')
          CURRENT_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Calculated MD5 Checksum: $MD5_CHECKSUM"
          echo "Current UTC Timestamp: $CURRENT_TIMESTAMP"

          # Use jq to update checksum and timestamp of the most recent version entry in manifest.json
          jq --arg checksum "$MD5_CHECKSUM" --arg timestamp "$CURRENT_TIMESTAMP" '
            .[0].versions[0].checksum = $checksum |
            .[0].versions[0].timestamp = $timestamp
          ' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json

      - name: Commit and Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "Automated build: update manifest.json checksum and timestamp [skip ci]"
            git push origin HEAD:main
          fi
          # Force update main tag to point to latest commit
          git tag -f main
          git push origin refs/tags/main --force

      - name: Deploy GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main
          name: "QuickSTRM (main)"
          files: QuickSTRM.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
