name: QuickSTRM Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish QuickSTRM
        run: dotnet publish -c Release -o ./publish/QuickSTRM

      # Packages artifacts with strict validation against bundled runtime libraries
      - name: Verify and Package Release Artifacts
        run: |
          if ls ./publish/QuickSTRM/Jellyfin.*.dll 1> /dev/null 2>&1 || ls ./publish/QuickSTRM/MediaBrowser.*.dll 1> /dev/null 2>&1; then
            echo "ERROR: Jellyfin runtime assemblies detected in publish output. ExcludeAssets=runtime is violated!"
            exit 1
          fi

          cp meta.json ./publish/QuickSTRM/
          cp build.yaml ./publish/QuickSTRM/

          # Recursively zip all contents including hidden files without flattening intended structures
          cd ./publish/QuickSTRM
          zip -r ../../QuickSTRM.zip .
          cd ../../

          cp ./publish/QuickSTRM/QuickSTRM.dll ./QuickSTRM.dll

      - name: Extract Release Notes
        id: notes
        run: |
          VERSION="${{ github.ref_name }}"
          CLEAN_VER="${VERSION#v}"
          
          # Use Fgrep/Awk literal matching to prevent bracket regex interpretation
          if grep -Fq "## [$CLEAN_VER]" CHANGELOG.md; then
            awk -v ver="## [$CLEAN_VER]" '
              index($0, ver) == 1 { flag=1; next }
              flag && index($0, "## [") == 1 { flag=0 }
              flag { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          else
            cp CHANGELOG.md RELEASE_NOTES.md
          fi

      - name: Update Manifest Checksum and Timestamp
        run: |
          # Calculate MD5 and convert to uppercase
          CHECKSUM=$(md5sum QuickSTRM.zip | awk '{ print $1 }' | tr 'a-z' 'A-Z')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Safely update the checksum and timestamp of the latest version (index 0)
          # Handles both standard Jellyfin array-based manifests and single-object manifests
          jq --arg checksum "$CHECKSUM" --arg timestamp "$TIMESTAMP" \
            'if type=="array" then 
               .[0].versions[0].checksum = $checksum | .[0].versions[0].timestamp = $timestamp 
             else 
               .versions[0].checksum = $checksum | .versions[0].timestamp = $timestamp 
             end' manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json

      - name: Commit and Push Manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: update manifest.json checksum [skip ci]"
            # Pull latest changes from origin/main to prevent race-condition non-fast-forward rejection
            git pull --rebase origin main || true
            # Explicitly push to the branch ref to bypass ambiguous tag/branch naming
            git push origin HEAD:refs/heads/main
          fi

      - name: Deploy Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          body_path: RELEASE_NOTES.md
          files: |
            QuickSTRM.zip
            QuickSTRM.dll
